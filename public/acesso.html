<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Access</title>
<meta name="robots" content="noindex">
<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1387916253326765');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1387916253326765&ev=PageView&noscript=1"
/></noscript>
<!-- End Meta Pixel Code -->
<style>
body{font-family:Arial;background:#080d20;color:#e8ebff;display:flex;justify-content:center;padding:40px 16px;margin:0}
.card{max-width:460px;width:100%;background:#101a3b;border:1px solid rgba(117,71,216,.6);border-radius:16px;padding:28px 24px;text-align:center}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#0a0f24;color:#fff;margin:8px 0;box-sizing:border-box}
button{padding:12px 22px;border-radius:10px;border:0;background:#7547d8;color:#fff;font-weight:700;cursor:pointer}
a{color:#f2cf78}
.err{color:#ff7b7b}
a.btn{display:inline-block;margin:6px 4px 0;padding:13px 24px;background:#dd3b32;color:#fff;text-decoration:none;border-radius:8px;font-weight:700}
.links{text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="card" id="box"><h2>🔓 Your Access</h2><p id="msg">Checking your order…</p></div>
<script>
(function(){
function qs(n){ try { return new URLSearchParams(location.search).get(n) || ""; } catch(e){ return ""; } }
function show(html){ document.getElementById("box").innerHTML = html; }
function esc(t){ var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function render(j){
  var links = (j.links || []).map(function(u){ return "<a class='btn' href='" + u + "' target='_blank' rel='noopener'>\u25B6 Watch now</a>"; }).join("");
  show("<h2>✅ Payment confirmed, " + esc(j.name) + "!</h2><p>" + esc(j.productName || "") + "</p><div class='links'><p><b>Start watching:</b></p><p>" + links + "</p><p><small>A copy was also sent to your email.</small></p></div>");
  // Purchase quando pagamento aprovado (página de acesso) — order = event_id p/ deduplicar com CAPI
  try {
    if (window.fbq && !window.__fb_purchase_fired) {
      window.__fb_purchase_fired = true;
      var isPremium = (j.access === "premium" || j.product === "premium");
      var val = isPremium ? 10.00 : 5.00;
      var cid = isPremium ? "premium" : "basic";
      var eid = order || ("order-" + Date.now());
      fbq("track", "Purchase", {value: val, currency: "USD", content_ids: [cid], content_type: "product"}, {eventID: eid});
    }
  } catch(e){}
}
var order = qs("order");
var tries = 0;
function poll(){
  if (!order || tries >= 60) return;
  tries++;
  fetch("/api/access?order=" + encodeURIComponent(order), {cache: "no-store"})
    .then(function(r){ return r.json().then(function(j){ return {s: r.status, j: j}; }); })
    .then(function(res){
      if (res.s === 200) { render(res.j); return; }
      setTimeout(poll, 5000);
    })
    .catch(function(){ setTimeout(poll, 5000); });
}
if (order) {
  fetch("/api/access?order=" + encodeURIComponent(order), {cache: "no-store"})
    .then(function(r){ return r.json().then(function(j){ return {s: r.status, j: j}; }); })
    .then(function(res){
      if (res.s === 200) render(res.j);
      else { show("<h2>⏳ Confirming payment…</h2><p>This page activates automatically once approved — keep it open. Or check by email below:</p><input id='em' placeholder='you@email.com'><p><button onclick=\"lookup()\">Check</button></p><p id='e2'></p>"); poll(); }
    });
} else {
  show("<h2>🔓 Your Access</h2><p>Enter the email used at checkout:</p><input id='em' placeholder='you@email.com'><p><button onclick=\"lookup()\">Check</button></p><p id='e2'></p>");
}
window.lookup = function(){
  var em = (document.getElementById("em") || {}).value || "";
  fetch("/api/access?email=" + encodeURIComponent(em), {cache: "no-store"})
    .then(function(r){ return r.json().then(function(j){ return {s: r.status, j: j}; }); })
    .then(function(res){ if (res.s === 200) render(res.j); else { var e = document.getElementById("e2"); if (e) e.innerHTML = "<span class='err'>No paid order for this email yet.</span>"; } });
};
})();
</script>
</body>
</html>
